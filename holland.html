<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>霍兰德职业兴趣测评 (RIASEC) - 独立测评</title>
  <meta name="description" content="寻找最适合你的天赋潜能与职业发展赛道">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Dynamic Background Glow Effects -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="holland.html" class="brand-logo"><span>🎯 霍兰德职业兴趣</span></a>
      <div class="nav-actions">
        <a href="#小程序://一子一木/0JPDrt84ecI5Gwd" class="btn btn-reward" onclick="openMiniProgramAd(); return false;">🎁 免费壁纸/抽大奖</a>
      </div>
    </div>
  </header>

  <!-- Toast Notification Container -->
  <div id="toastMsg" class="toast-msg">
    <span>📱</span> <span id="toastText">正在跳转微信小程序【一子一木】...</span>
  </div>

  <main class="main-container">

    <!-- Standalone Hero Intro Area -->
    <div id="heroIntro" class="hero-section">
      <h1 class="hero-title">🎯 霍兰德职业兴趣 (RIASEC) 测评<br><span class="hero-gradient-text">寻找最适合你的天赋潜能与职业赛道</span></h1>
      <p class="hero-subtitle">实用型 · 研究型 · 艺术型 · 社会型 · 企业型 · 传统型，精准匹配你的职业优势与行业方向。</p>

      <button class="btn btn-primary" onclick="checkAndStartTest('holland')">
        🚀 立即开始测试 →
      </button>


      <!-- 免责声明 -->
      <p style="font-size:0.76rem; color:var(--text-sub); margin-top:0.7rem; margin-bottom:2rem;">
        ⚖️ 免责声明：本测评基于霍兰德职业兴趣理论，仅供职业规划与自我发展参考。
      </p>
    </div>

    <!-- Test Flow Container -->
    <div id="testFlow" class="test-flow-container" style="display:none;">
      <div class="test-flow-header">
        <h2 class="flow-title">霍兰德测评进行中</h2>
        <span class="progress-text" id="progressText">1 / 6</span>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>

      <div class="question-card">
        <div class="question-number" id="questionNumber">QUESTION 1</div>
        <h3 class="question-text" id="questionText">题目加载中...</h3>
        
        <div class="options-list" id="optionsList">
          <!-- Injected via JS -->
        </div>
      </div>

      <div class="flow-controls">
        <button class="btn btn-outline" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loadingBox" class="loading-container" style="display:none;">
      <div class="spinner"></div>
      <p class="loading-text">正在深度解析您的测评维度与性格特征模型...</p>
    </div>

    <!-- Result Report Container -->
    <div id="resultContainer" class="result-container" style="display:none;">
      <!-- Dynamically Generated Report -->
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
